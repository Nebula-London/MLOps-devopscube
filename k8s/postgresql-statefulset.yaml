apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: airflow-postgresql
  namespace: airflow
spec:
  serviceName: airflow-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgresql
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: airflow
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgresql
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: airflow
    spec:
      securityContext:
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      initContainers:
      - name: fix-permissions
        image: busybox
        command: ["sh", "-c", "chown -R 70:70 /bitnami/postgresql /var/run/postgresql 2>/dev/null; chmod 777 /var/run/postgresql 2>/dev/null; true"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: data
          mountPath: /bitnami/postgresql
        - name: dshm
          mountPath: /dev/shm
      containers:
      - name: postgresql
        image: docker.io/postgres:16-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_HOST_AUTH_METHOD
          value: "trust"
        - name: PGDATA
          value: /bitnami/postgresql/data
        - name: POSTGRES_VOLUME_DIR
          value: /bitnami/postgresql
        - name: BITNAMI_DEBUG
          value: "false"
        - name: POSTGRESQL_PORT_NUMBER
          value: "5432"
        ports:
        - name: postgresql
          containerPort: 5432
          protocol: TCP
        volumeMounts:
        - name: data
          mountPath: /bitnami/postgresql
        - name: dshm
          mountPath: /dev/shm
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        app.kubernetes.io/component: postgresql
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: airflow
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: local-path
      resources:
        requests:
          storage: 10Gi
